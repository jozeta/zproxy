name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests (parsers, scope, match & replace, intruder, security regressions)
        # Explicit file list: Node 22 doesn't accept a directory argument for --test.
        run: node --test tests/*.test.js
